name: Batch edit

# One clip per run. n8n (queue service) dispatches at most 3-4 of these at a time. job_id is in the run title so n8n finds exactly ITS run.
run-name: Batch ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "unique job id (from the queue)"
        required: true
      video_url:
        description: "direct link to the source video"
        required: true
      preset:
        description: "dark | proof | slab"
        required: true
      plan_run:
        description: "run id whose `plan` artifact (analysis + plan + stock) is reused instead of planning again"
        required: false
        default: ""
      plan_b64:
        description: "optional gzip+base64 plan.json that overrides the planned one (variety rewrite)"
        required: false
        default: ""
      plan_only:
        description: "true = analyze + plan only (no rendering)"
        required: false
        default: "false"
      prior:
        description: "concepts of the previous clips of the batch (';' list) the planner must not repeat"
        required: false
        default: ""
      clip_no:
        description: "arrival number in the batch (rotates the wildcard types)"
        required: false
        default: "0"
      seed:
        description: "variety seed"
        required: false
        default: "0"
      recent:
        description: "wildcards used by the previous clips of the batch (comma list)"
        required: false
        default: ""
      model:
        description: "planner model"
        required: false
        default: ""
      whisper:
        description: "faster-whisper model"
        required: false
        default: "large-v3"

permissions:
  contents: read
  actions: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"
  HYPERFRAMES_NO_UPDATE_CHECK: "1"
  HF_CAPTURE_PARALLEL_STREAM: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.parts.outputs.matrix }}
      dur: ${{ steps.parts.outputs.dur }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: batch/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System deps
        run: for i in 1 2 3; do timeout 150 sudo apt-get update -y && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg && break; echo apt retry $i; done
      - run: pip install -r batch/requirements.txt
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code@2.1.293 --no-audit --no-fund && claude --version
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.whisper || 'large-v3' }}
      - name: Download source (link is masked)
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          echo "::add-mask::$VIDEO_URL"
          curl -sS -f -L --retry 3 "$VIDEO_URL" -o source.mp4
          test -s source.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height:format=duration -of csv=p=0 source.mp4
      - name: Analyze (probe, words, cuts, face)
        if: ${{ inputs.plan_run == '' }}
        run: python batch/analyze.py source.mp4 work --model "${{ inputs.whisper || 'large-v3' }}"
      - name: Plan (one headless Claude call) + stock cutaways
        if: ${{ inputs.plan_run == '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PLAN_MODEL: ${{ inputs.model || vars.PLAN_MODEL }}
        run: |
          python3 -c "import json,sys;json.dump({'recent_wildcards':[x for x in sys.argv[1].split(',') if x],'prior_concepts':[x.strip() for x in sys.argv[2].split(';') if x.strip()]},open('work/payload.json','w'))" "${{ inputs.recent }}" "${{ inputs.prior }}"
          python batch/plan.py work/analysis.json --preset "${{ inputs.preset }}" --out work/plan.json --payload work/payload.json --seed "${{ inputs.seed }}" --clip-no "${{ inputs.clip_no }}"
          python batch/stock.py --plan work/plan.json --out work/stock
      - name: Reuse the planned work (plan artifact)
        if: ${{ inputs.plan_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PLAN_B64: ${{ inputs.plan_b64 }}
        run: |
          mkdir -p work
          gh run download "${{ inputs.plan_run }}" -R "$GITHUB_REPOSITORY" -n plan -D plan_in
          gh run download "${{ inputs.plan_run }}" -R "$GITHUB_REPOSITORY" -n stock -D plan_in/stock || mkdir -p plan_in/stock
          cp -r plan_in/* work/
          ls -la work
          if [ -n "$PLAN_B64" ]; then
            python3 -c "import base64,gzip,os;open('work/plan.json','wb').write(gzip.decompress(base64.b64decode(os.environ['PLAN_B64'])))"
            rm -rf work/stock && python batch/stock.py --plan work/plan.json --out work/stock
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            work/analysis.json
            work/plan.json
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stock
          path: work/stock
          retention-days: 2
          compression-level: 0
          if-no-files-found: ignore
      - name: Parts
        id: parts
        if: ${{ inputs.plan_only != 'true' }}
        run: |
          python3 - <<'PY'
          import json, math, os
          an = json.load(open('work/analysis.json'))
          dur = an['dur']
          n = max(1, math.ceil(dur / 30.0))
          cuts = [dur * i / n for i in range(n)] + [dur]
          parts = [{'n': i + 1, 'a': f'{cuts[i]:.3f}', 'b': f'{cuts[i + 1]:.3f}'} for i in range(n)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'include': parts}) + '\n')
              f.write(f'dur={dur}\n')
          print(parts)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.plan_only != 'true' }}
        with:
          name: work
          path: |
            work/analysis.json
            work/plan.json
            work/stock
            source.mp4
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  part:
    needs: analyze
    if: ${{ inputs.plan_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.analyze.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System deps
        run: for i in 1 2 3; do timeout 150 sudo apt-get update -y && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg && break; echo apt retry $i; done
      - run: pip install fonttools brotli numpy
      - name: HyperFrames (pinned)
        working-directory: engine
        run: npm ci --no-audit --no-fund && npx --no-install hyperframes --version
      - uses: actions/download-artifact@v4
        with:
          name: work
          path: in
      - name: Range of the clip (graded, 1080x1920, cover-crop)
        run: |
          PRESET=$(python3 -c "import json;print(json.load(open('in/work/plan.json'))['preset'])")
          GR=$(python3 batch/presets.py get $PRESET grade)
          mkdir -p work/proj/media
          ffmpeg -y -loglevel error -ss ${{ matrix.a }} -t $(python3 -c "print(round(${{ matrix.b }}-${{ matrix.a }},3))") -i in/source.mp4 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,unsharp=5:5:0.6:5:5:0.0,$GR" -r 30 -an -c:v libx264 -crf 12 -preset fast -pix_fmt yuv420p work/range.mp4
      - name: Build composition
        run: |
          python3 batch/build.py --analysis in/work/analysis.json --plan in/work/plan.json --a ${{ matrix.a }} --b ${{ matrix.b }} --out work/proj --clip work/range.mp4 --fonts batch/fonts --gsap engine/static/gsap.min.js
          cp in/work/stock/stock*.mp4 work/proj/media/ 2>/dev/null || true
      - name: Lint
        working-directory: work/proj
        run: ../../engine/node_modules/.bin/hyperframes lint || true
      - name: Render part ${{ matrix.n }}
        working-directory: work/proj
        run: |
          mkdir -p ../../out
          timeout 3000 ../../engine/node_modules/.bin/hyperframes render --output ../../out/part${{ matrix.n }}.mp4 --fps 30 --quality standard --workers 4
          free -m
      - uses: actions/upload-artifact@v4
        with:
          name: part${{ matrix.n }}
          path: out/part${{ matrix.n }}.mp4
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  assemble:
    needs: [analyze, part]
    if: ${{ inputs.plan_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: System deps
        run: for i in 1 2 3; do timeout 150 sudo apt-get update -y && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg && break; echo apt retry $i; done
      - uses: actions/download-artifact@v4
        with:
          name: work
          path: in
      - uses: actions/download-artifact@v4
        with:
          pattern: part*
          path: parts
          merge-multiple: true
      - name: Audio (voice untouched, music + SFX at the agreed levels)
        run: python3 batch/mix.py in/source.mp4 in/work/plan.json in/work/analysis.json mix.m4a --levels levels.json | tee levels.txt
      - name: Stitch parts + mux
        run: |
          for f in $(ls parts/part*.mp4 | sort -V); do echo "file '$f'" >> list.txt; done
          D=${{ needs.analyze.outputs.dur }}
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -i mix.m4a -map 0:v:0 -map 1:a:0 \
            -vf "format=yuv420p" -c:v libx264 -preset medium -crf 18 -r 30 -c:a copy -movflags +faststart -t $D final.mp4
          ffprobe -v error -show_entries format=duration,size -of csv=p=0 final.mp4
          ffmpeg -y -loglevel error -i final.mp4 -vf "fps=1/3,scale=216:-1,tile=8x3" -frames:v 1 contact.jpg
          python3 batch/gates.py in/work/plan.json in/work/analysis.json levels.json final.mp4 gates.json
          python3 - <<'PY'
          import json
          plan = json.load(open('in/work/plan.json')); an = json.load(open('in/work/analysis.json')); lv = json.load(open('levels.json'))
          res = {'preset': plan['preset'], 'wildcard': plan['wildcard']['type'], 'wildcard_note': plan['wildcard'].get('note'), 
                 'planner': plan.get('planner'), 'planner_meta': plan.get('planner_meta'),
                 'inserts': [(i['kind'], i['t']) for i in plan['inserts']], 'summary': plan.get('summary'), 'notes': plan.get('notes'),
                 'dur': an['dur'], 'analysis_timings': an.get('timings'), 'levels': lv, 'gates': json.load(open('gates.json')),
                 'concept': plan.get('concept_name'), 'concept_kind': plan.get('concept_kind'), 'concept_pitch': plan.get('concept_pitch'), 'tone': plan.get('tone'),
                 'style': plan.get('style'), 'hook': plan['hook']['lines'], 'ins_kinds': [i['kind'] for i in plan['inserts']], 'music': lv.get('music_file')}
          json.dump(res, open('result.json', 'w'), ensure_ascii=False, indent=1)
          print(json.dumps(res, ensure_ascii=False)[:1500])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: |
            final.mp4
            contact.jpg
            result.json
            levels.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
