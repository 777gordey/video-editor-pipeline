name: Re-render one version

# Fast loop for design/audio polishing: reuses the `prep` and `alpha` artifacts of an earlier edit-video-v2 run
# (no whisper, no planner, no matting). Result: artifact `version-<V>` (+ `debug-<V>`).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "edit-video-v2 run id whose prep + alpha artifacts are reused"
        required: true
      version:
        description: "V1..V5"
        required: false
        default: "V1"

permissions:
  contents: read
  actions: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"
  HYPERFRAMES_NO_UPDATE_CHECK: "1"
  HF_CAPTURE_PARALLEL_STREAM: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: System deps
        run: for i in 1 2 3; do timeout 150 sudo apt-get update -y && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg && break; echo apt retry $i; done

      - name: Python deps
        run: pip install -r engine/requirements.txt

      - name: HyperFrames (pinned in package-lock)
        working-directory: engine
        run: |
          npm ci --no-audit --no-fund
          npx --no-install hyperframes --version

      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: alpha
          path: alpha
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Render ${{ inputs.version }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p out
          python engine/render_version.py --version "${{ inputs.version }}" --prep prep --out out --work work --alpha alpha/alpha_small.mkv
          free -m

      - name: Self-QA ${{ inputs.version }}
        run: |
          cd engine
          python qa.py check --video ../out/final_${{ inputs.version }}.mp4 --plan ../out/plan_${{ inputs.version }}.json --transcript ../prep/transcript.json --version ${{ inputs.version }} --out ../out --duck ../out/duck_${{ inputs.version }}.json --expected-dur "$(ffprobe -v error -show_entries format=duration -of csv=p=0 ../prep/prepped.mp4)" || true

      - name: Audio review pictures (small)
        run: |
          V=${{ inputs.version }}
          ffmpeg -y -loglevel error -i out/final_$V.mp4 -lavfi "showspectrumpic=s=1400x420:legend=0:scale=log" out/audio_spec_$V.jpg || true
          ffmpeg -y -loglevel error -i out/final_$V.mp4 -lavfi "aformat=channel_layouts=mono,showwavespic=s=1400x220:colors=#FFD400" -frames:v 1 out/audio_wave_$V.jpg || true
          ffmpeg -hide_banner -nostats -i out/final_$V.mp4 -af ebur128=peak=true -f null - 2>&1 | grep -E "^\s+(I|LRA|Peak):" > out/audio_stats_$V.txt || true
          ls -la out | head -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-${{ inputs.version }}
          path: |
            out/contact_*.jpg
            out/hook_*.jpg
            out/debug_*.jpg
            out/cover_*.jpg
            out/plan_*.json
            out/timings_*.json
            out/qa_*.json
            out/duck_*.json
            out/audio_*
          retention-days: 1
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-${{ inputs.version }}
          path: |
            out/final_*.mp4
            out/cover_*.jpg
            out/contact_*.jpg
            out/hook_*.jpg
            out/debug_*.jpg
            out/plan_*.json
            out/timings_*.json
            out/qa_*.json
            out/duck_*.json
          retention-days: 1
          if-no-files-found: warn
