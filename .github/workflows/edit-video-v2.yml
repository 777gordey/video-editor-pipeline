name: Edit video v2

on:
  repository_dispatch:
    types: [edit-video-v2]
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct link to the source video. Empty = use secret TEST_VIDEO_URL"
        required: false
        default: ""
      versions:
        description: "Comma list of versions to render"
        required: false
        default: "V1,V2,V3,V4,V5"
      whisper:
        description: "faster-whisper model (large-v3 = final, small = draft)"
        required: false
        default: "large-v3"
      darken:
        description: "Test only: darken the source by N stops (1.5 = underexposed test)"
        required: false
        default: "0"
      caption:
        description: "Test only: Telegram caption (ХУКИ / ТРИГГЕРЫ / ФОН)"
        required: false
        default: ""
      source_run:
        description: "Test only: run id whose `prep` artifact (prepped.mp4) is reused as the source clip"
        required: false
        default: ""
      loop:
        description: "Test only: repeat the source N times (2 = long-clip stress test)"
        required: false
        default: "1"

permissions:
  contents: read
  actions: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"
  HYPERFRAMES_NO_UPDATE_CHECK: "1"
  HF_CAPTURE_PARALLEL_STREAM: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  # Tiny token check (caption "__CLAUDE_CHECK__"): one headless call, no secrets printed.
  claude-check:
    if: ${{ inputs.caption == '__CLAUDE_CHECK__' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g @anthropic-ai/claude-code@2.1.293 --no-audit --no-fund
      - name: Planner token test
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p 'Reply with exactly: PLANNER_OK' --max-turns 1 --output-format json > r.json || true
          python3 -c "import json;d=json.load(open('r.json'));print('is_error=',d.get('is_error'),'subtype=',d.get('subtype'));print('RESULT:',str(d.get('result'))[:120])"

  prep:
    if: ${{ inputs.caption != '__CLAUDE_CHECK__' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      versions: ${{ steps.v.outputs.versions }}
      needs_matte: ${{ steps.v.outputs.needs_matte }}
    steps:
      - uses: actions/checkout@v4

      - name: Pexels key check (status code only)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: $PEXELS_API_KEY" "https://api.pexels.com/videos/search?query=forest&per_page=1")
          echo "Pexels API status: $code"

      - name: Pick versions
        id: v
        env:
          REQ: ${{ github.event.inputs.versions }}
          CAPTION: ${{ github.event.client_payload.caption || github.event.inputs.caption }}
        run: |
          REQ="${REQ:-V1,V2,V3,V4,V5}"
          # caption line «ВЕРСИИ: 1,3» overrides the list (bad caption = ignored)
          CV=$(PYTHONPATH=engine python3 -c "import os,caption;print(','.join(caption.parse(os.environ.get('CAPTION',''))['versions']))" 2>/dev/null || true)
          [ -n "$CV" ] && REQ="$CV"
          echo "versions=$(python3 -c "import json,sys;print(json.dumps([x.strip().upper() for x in sys.argv[1].split(',') if x.strip()]))" "$REQ")" >> "$GITHUB_OUTPUT"
          if [ "$REQ" = "V1" ]; then echo "needs_matte=false" >> "$GITHUB_OUTPUT"; else echo "needs_matte=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: System deps
        run: for i in 1 2 3; do timeout 150 sudo apt-get update -y && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg && break; echo apt retry $i; done

      - name: Python deps
        run: pip install -r engine/requirements.txt

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ github.event.inputs.whisper || 'large-v3' }}

      # Link may carry a secret path: only through env, masked, never echoed.
      - name: Download source
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.inputs.video_url || secrets.TEST_VIDEO_URL }}
          SOURCE_RUN: ${{ github.event.inputs.source_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$SOURCE_RUN" ]; then
            gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n prep -D src_prep && cp src_prep/prepped.mp4 source.mp4
          else
          [ "$VIDEO_URL" = "selftest" ] || echo "::add-mask::$VIDEO_URL"
          test -n "$VIDEO_URL" || { echo "no video url"; exit 1; }
          if [ "$VIDEO_URL" = "selftest" ]; then bash engine/selftest.sh source.mp4; else
            curl -sS -f -L --retry 3 "$VIDEO_URL" -o source.mp4; fi
          fi
          test -s source.mp4
          L="${{ github.event.inputs.loop }}"
          if [ -n "$L" ] && [ "$L" -gt 1 ] 2>/dev/null; then
            ffmpeg -y -loglevel error -stream_loop $((L-1)) -i source.mp4 -c copy source_long.mp4 && mv source_long.mp4 source.mp4
          fi
          D="${{ github.event.inputs.darken }}"
          if [ -n "$D" ] && [ "$D" != "0" ]; then
            F=$(python3 -c "print(round(2**(-float('$D')/2.2),3))")
            ffmpeg -y -loglevel error -i source.mp4 -vf "lutrgb=r=val*$F:g=val*$F:b=val*$F,noise=alls=3:allf=t" -c:v libx264 -crf 14 -c:a copy dark.mp4 && mv dark.mp4 source.mp4
            echo "darkened by $D stops (gain $F)"
          fi
          ls -la source.mp4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # One headless Claude Code call (inside prep.py) plans all versions and proposes semantic cuts (subscription token, no API keys).
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code@2.1.293 --no-audit --no-fund && claude --version

      # Caption goes through env only (never interpolated into a shell line); bad input = empty result.
      - name: Parse caption
        env:
          CAPTION: ${{ github.event.client_payload.caption || github.event.inputs.caption }}
        run: |
          mkdir -p out
          python engine/caption.py out/caption.json "$GITHUB_ENV" || echo '{"hooks":[],"triggers":[],"bg":null,"warnings":["parse failed"]}' > out/caption.json

      - name: Prep (normalize, transcribe, cut, speed up)
        env:
          WHISPER_MODEL: ${{ github.event.inputs.whisper || 'large-v3' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PLAN_MODEL: ${{ vars.PLAN_MODEL }}
        run: |
          mkdir -p out
          /usr/bin/time -v python engine/prep.py source.mp4 --out out 2> >(tee time_prep.txt >&2) | tee prep.log
          grep -E "Maximum resident|Elapsed" time_prep.txt || true
          free -m

      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: |
            out/prepped.mp4
            out/transcript.json
            out/plans.json
            out/cuts.md
            out/exposure.json
            out/caption.json
            out/exposure_compare.jpg
          retention-days: 1
          if-no-files-found: error

  matte:
    needs: prep
    if: ${{ needs.prep.outputs.needs_matte == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: System deps
        run: for i in 1 2 3; do timeout 150 sudo apt-get update -y && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg && break; echo apt retry $i; done
      - name: Python deps
        run: pip install -r engine/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep
      - name: Matte once for all versions (RVM)
        working-directory: engine
        run: python matte.py ../prep/prepped.mp4 ../alpha_small.mkv ../rvm.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: alpha
          path: alpha_small.mkv
          retention-days: 1
          if-no-files-found: error

  render:
    needs: [prep, matte]
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prep.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: System deps
        run: for i in 1 2 3; do timeout 150 sudo apt-get update -y && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg && break; echo apt retry $i; done

      - name: Python deps
        run: pip install -r engine/requirements.txt

      - name: HyperFrames (pinned in package-lock)
        working-directory: engine
        run: |
          npm ci --no-audit --no-fund
          npx --no-install hyperframes --version
          npx --no-install hyperframes doctor || true

      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: alpha
          path: alpha

      - name: Render ${{ matrix.version }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p out
          python engine/render_version.py --version "${{ matrix.version }}" --prep prep --out out --work work --alpha alpha/alpha_small.mkv
          free -m

      - name: Self-QA ${{ matrix.version }}
        run: |
          cd engine
          python qa.py check --video ../out/final_${{ matrix.version }}.mp4 --plan ../out/plan_${{ matrix.version }}.json             --transcript ../prep/transcript.json --version ${{ matrix.version }} --out ../out             --duck ../out/duck_${{ matrix.version }}.json --expected-dur "$(ffprobe -v error -show_entries format=duration -of csv=p=0 ../prep/prepped.mp4)" || true

      - name: Per-job memory snapshot
        if: always()
        run: free -m; df -h . | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-${{ matrix.version }}
          path: |
            out/debug_*.jpg
            out/plan_*.json
            out/timings_*.json
            out/qa_*.json
            out/platematch_*.json
            out/cover_*.jpg
            out/contact_*.jpg
            out/hook_*.jpg
          retention-days: 1
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-${{ matrix.version }}
          path: |
            out/final_*.mp4
            out/cover_*.jpg
            out/contact_*.jpg
            out/hook_*.jpg
            out/debug_*.jpg
            out/plan_*.json
            out/timings_*.json
            out/qa_*.json
            out/duck_*.json
          retention-days: 1
          if-no-files-found: warn

  collect:
    needs: [prep, render]
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: "{prep,debug-*}"
          path: parts
      - run: pip install 'numpy<2.3'
      - name: Assemble
        run: |
          mkdir -p result
          cp parts/prep/cuts.md result/cuts.md
          cp parts/prep/exposure_compare.jpg result/ 2>/dev/null || true
          find parts -name 'qa_V*.json' | sed 's#.*/##' > result/_finals.txt
          find parts -name 'contact_V*.jpg' -exec cp {} result/ \;
          find parts -name 'cover_V*.jpg' -exec cp {} result/ \;
          find parts -name 'timings_V*.json' -exec cp {} result/ \;
          cd engine && python qa.py report --dir ../parts --out ../result/QA_report.md
          cd ..
          cat result/QA_report.md
          ls -la result
          n=$(wc -l < result/_finals.txt); echo "versions ready: $n"
          test "$n" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: |
            result/contact_V*.jpg
            result/cover_V*.jpg
            result/cuts.md
            result/exposure_compare.jpg
            result/QA_report.md
          retention-days: 1
          if-no-files-found: error
