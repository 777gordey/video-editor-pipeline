name: Edit video v2

on:
  repository_dispatch:
    types: [edit-video-v2]
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct link to the source video. Empty = use secret TEST_VIDEO_URL"
        required: false
        default: ""
      versions:
        description: "Comma list of versions to render"
        required: false
        default: "V1,V2,V3,V4,V5"
      whisper:
        description: "faster-whisper model (large-v3 = final, small = draft)"
        required: false
        default: "large-v3"

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"
  HYPERFRAMES_NO_UPDATE_CHECK: "1"
  HF_CAPTURE_PARALLEL_STREAM: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick versions
        id: v
        env:
          REQ: ${{ github.event.inputs.versions }}
        run: |
          REQ="${REQ:-V1,V2,V3,V4,V5}"
          echo "versions=$(python3 -c "import json,sys;print(json.dumps([x.strip().upper() for x in sys.argv[1].split(',') if x.strip()]))" "$REQ")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: System deps
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Python deps
        run: pip install -r engine/requirements.txt

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ github.event.inputs.whisper || 'large-v3' }}

      # Link may carry a secret path: only through env, masked, never echoed.
      - name: Download source
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.inputs.video_url || secrets.TEST_VIDEO_URL }}
        run: |
          [ "$VIDEO_URL" = "selftest" ] || echo "::add-mask::$VIDEO_URL"
          test -n "$VIDEO_URL" || { echo "no video url"; exit 1; }
          if [ "$VIDEO_URL" = "selftest" ]; then bash engine/selftest.sh source.mp4; else
            curl -sS -f -L --retry 3 "$VIDEO_URL" -o source.mp4; fi
          test -s source.mp4
          ls -la source.mp4

      - name: Prep (normalize, transcribe, cut, speed up)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHISPER_MODEL: ${{ github.event.inputs.whisper || 'large-v3' }}
        run: |
          mkdir -p out
          /usr/bin/time -v python engine/prep.py source.mp4 --out out 2> >(tee time_prep.txt >&2) | tee prep.log
          grep -E "Maximum resident|Elapsed" time_prep.txt || true
          free -m

      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: |
            out/prepped.mp4
            out/transcript.json
            out/cuts.md
          retention-days: 1
          if-no-files-found: error

  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prep.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: System deps
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Python deps
        run: pip install -r engine/requirements.txt

      - name: HyperFrames (pinned in package-lock)
        working-directory: engine
        run: |
          npm ci --no-audit --no-fund
          npx --no-install hyperframes --version
          npx --no-install hyperframes doctor || true

      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep

      - name: Render ${{ matrix.version }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p out
          python engine/render_version.py --version "${{ matrix.version }}" --prep prep --out out --work work
          free -m

      - name: Per-job memory snapshot
        if: always()
        run: free -m; df -h . | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-${{ matrix.version }}
          path: |
            out/final_*.mp4
            out/debug_*.jpg
            out/plan_*.json
            out/timings_*.json
          retention-days: 1
          if-no-files-found: warn

  collect:
    needs: [prep, render]
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Assemble
        run: |
          mkdir -p result
          cp parts/prep/cuts.md result/cuts.md
          find parts -name 'final_V*.mp4' -exec cp {} result/ \;
          find parts -name 'timings_V*.json' -exec cp {} result/ \;
          ls -la result
          n=$(ls result/final_V*.mp4 2>/dev/null | wc -l); echo "versions ready: $n"
          test "$n" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: |
            result/final_V*.mp4
            result/cuts.md
          retention-days: 1
          if-no-files-found: error
