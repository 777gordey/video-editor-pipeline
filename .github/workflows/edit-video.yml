name: Edit video

on:
  repository_dispatch:
    types: [process-video]

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg, libass for subtitle burn)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libass-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper opencv-python-headless

      # video_url приходит из client_payload и может содержать секрет
      # (например Telegram File API токен) — никогда не печатаем/не логируем
      # его в открытом виде, только маскируем и используем внутри curl.
      - name: Mask video_url in logs
        run: |
          echo "::add-mask::${{ github.event.client_payload.video_url }}"

      - name: Download source video
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url }}
        run: |
          curl -sS -f -L "$VIDEO_URL" -o source.mp4
          test -s source.mp4

      - name: Process video
        run: |
          python scripts/process_video.py source.mp4 --max-seconds 300 --out final.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
          retention-days: 1
          if-no-files-found: error
