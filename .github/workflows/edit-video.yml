name: Edit video

on:
  repository_dispatch:
    types: [process-video]
  # Ручной запуск для тестирования на ветке (без n8n/Telegram) — тот же
  # раннер, те же секреты. video_url обязателен: прямая ссылка на mp4.
  workflow_dispatch:
    inputs:
      video_url:
        description: "Прямая ссылка на исходное видео (mp4)"
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg, libass for subtitle burn)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libass-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper "opencv-python-headless<5" requests Pillow

      # video_url приходит из client_payload (или вручную через workflow_dispatch)
      # и может содержать секрет (например Telegram File API токен) — никогда
      # не печатаем/не логируем его в открытом виде, только маскируем.
      - name: Mask video_url in logs
        run: |
          echo "::add-mask::${{ github.event.client_payload.video_url }}${{ github.event.inputs.video_url }}"

      - name: Download source video
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.inputs.video_url }}
        run: |
          curl -sS -f -L "$VIDEO_URL" -o source.mp4
          test -s source.mp4

      - name: Process video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHOTSTACK_API_KEY: ${{ secrets.SHOTSTACK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python scripts/process_video.py source.mp4 --max-seconds 300 --out final.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: |
            final.mp4
            thumbnail_*.jpg
          retention-days: 1
          if-no-files-found: error
